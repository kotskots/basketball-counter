<html>
  <head>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <h3>HOME</h3>
        <h3 class="counter" id="home-counter">0</h3>
        <div class="buttons-container">
          <button id="plus-one-home-btn" onclick="homeaddone()">+1</button>
          <button id="plus-two-home-btn" onclick="homeaddtwo()">+2</button>
          <button id="plus-three-home-btn" onclick="homeaddthree()">+3</button>
        </div>
      </div>
      <div>
        <h3>AWAY</h3>
        <h3 class="counter" id="guest-counter">0</h3>
        <div class="buttons-container">
          <button id="plus-one-guest-btn" onclick="guestaddone()">+1</button>
          <button id="plus-two-guest-btn" onclick="guestaddtwo()">+2</button>
          <button id="plus-three-guest-btn" onclick="guestaddthree()">
            +3
          </button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
